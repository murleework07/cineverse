services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cineverse
      MYSQL_USER: cineverse
      MYSQL_PASSWORD: cineverse
    ports: ["3306:3306"]
    volumes: [db-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  server:
    build: ./server
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER: cineverse
      DB_PASSWORD: cineverse
      DB_NAME: cineverse
      CLIENT_ORIGIN: http://localhost:8080
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-me-with-a-long-random-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-me-with-a-long-random-refresh-secret}
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]

  client:
    build: ./client
    depends_on: [server]
    ports: ["8080:80"]

volumes:
  db-data:
